<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Containers versus virtual machines</title>
  <desc id="d">Side-by-side diagram. Left: virtual machines, each with its own full guest operating system on top of a hypervisor. Right: containers, each holding only the app and its libraries, sharing one host kernel through a container engine.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff735e"/><stop offset="1" stop-color="#f4a340"/></linearGradient>
    <filter id="sh" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123c52" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fff8e9"/>
  <rect x="20" y="20" width="1160" height="720" rx="16" fill="url(#sky)"/>
<text x="600" y="88" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Virtual machines vs containers</text>
<g filter="url(#sh)"><rect x="70" y="120" width="520" height="540" rx="18" fill="#fff"/></g><text x="330" y="160" font-size="24" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Virtual machines</text>
<text x="330" y="185" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>heavy, slow to start, fully separate</text>
<rect x="100" y="205" width="140" height="190" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="110" y="215" width="120" height="50" rx="12" fill="#ffd166"/><text x="170.0" y="246.0" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="110" y="272" width="120" height="50" rx="12" fill="#ff735e2e"/><text x="170.0" y="303.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="110" y="329" width="120" height="58" rx="10" fill="#123c52"/><text x="170.0" y="358.0" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Whole guest OS</text>
<text x="170.0" y="382.0" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own kernel!</text>
<rect x="260" y="205" width="140" height="190" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="270" y="215" width="120" height="50" rx="12" fill="#ffd166"/><text x="330.0" y="246.0" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="270" y="272" width="120" height="50" rx="12" fill="#ff735e2e"/><text x="330.0" y="303.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="270" y="329" width="120" height="58" rx="10" fill="#123c52"/><text x="330.0" y="358.0" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Whole guest OS</text>
<text x="330.0" y="382.0" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own kernel!</text>
<rect x="420" y="205" width="140" height="190" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="430" y="215" width="120" height="50" rx="12" fill="#ffd166"/><text x="490.0" y="246.0" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="430" y="272" width="120" height="50" rx="12" fill="#ff735e2e"/><text x="490.0" y="303.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="430" y="329" width="120" height="58" rx="10" fill="#123c52"/><text x="490.0" y="358.0" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Whole guest OS</text>
<text x="490.0" y="382.0" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own kernel!</text>
<rect x="100" y="410" width="460" height="55" rx="12" fill="#126c73"/><text x="330.0" y="437.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Hypervisor</text>
<text x="330.0" y="461.5" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>pretends to be three separate computers</text>
<rect x="100" y="475" width="460" height="55" rx="12" fill="#2a5a73"/><text x="330.0" y="508.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Host operating system</text>
<rect x="100" y="540" width="460" height="55" rx="12" fill="#123c52"/><text x="330.0" y="573.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Hardware</text>
<text x="330" y="630" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Three kernels running. Gigabytes each. Minutes to boot.</text>
<g filter="url(#sh)"><rect x="620" y="120" width="510" height="540" rx="18" fill="#fff"/></g><text x="875" y="160" font-size="24" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Containers</text>
<text x="875" y="185" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>light, start in a blink, share the kernel</text>
<rect x="650" y="230" width="140" height="140" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="660" y="240" width="120" height="55" rx="12" fill="#ffd166"/><text x="720.0" y="273.5" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="660" y="303" width="120" height="55" rx="12" fill="#ff735e2e"/><text x="720.0" y="336.5" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="805" y="230" width="140" height="140" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="815" y="240" width="120" height="55" rx="12" fill="#ffd166"/><text x="875.0" y="273.5" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="815" y="303" width="120" height="55" rx="12" fill="#ff735e2e"/><text x="875.0" y="336.5" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="960" y="230" width="140" height="140" rx="10" fill="#f7f3ea" stroke="#e5dccb" stroke-width="2"/><rect x="970" y="240" width="120" height="55" rx="12" fill="#ffd166"/><text x="1030.0" y="273.5" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>App</text>
<rect x="970" y="303" width="120" height="55" rx="12" fill="#ff735e2e"/><text x="1030.0" y="336.5" font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Libraries</text>
<rect x="650" y="410" width="450" height="55" rx="12" fill="#126c73"/><text x="875.0" y="437.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Container engine (Docker)</text>
<text x="875.0" y="461.5" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>sets up the blinders and seatbelts</text>
<rect x="650" y="475" width="450" height="55" rx="12" fill="#2a5a73"/><text x="875.0" y="508.5" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Host operating system: one shared Linux kernel</text>
<rect x="650" y="540" width="450" height="55" rx="12" fill="#123c52"/><text x="875.0" y="573.5" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Hardware</text>
<text x="875" y="630" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>One kernel. Megabytes each. Starts in milliseconds.</text>
<rect x="20" y="698" width="1160" height="42" fill="#123c52" fill-opacity=".9"/><path d="M20 740a16 16 0 0 0 16 16h1128a16 16 0 0 0 16-16z" fill="#123c52" fill-opacity=".9"/><text x="600.0" y="725" font-size="15" font-weight="600" text-anchor="middle" fill="#7edbd0" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>A VM fakes a whole computer. A container fakes a whole computer&#x27;s worth of privacy for one program.</text>
</svg>
