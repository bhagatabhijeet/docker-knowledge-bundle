<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" font-family="Ubuntu, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The five-step pipeline and the two headaches of dedicated servers</title>
  <desc id="d">Top: five steps from development to local testing to packaging to deployment to production. Bottom left: three servers each running one small app with most of the box empty, labelled wasted hardware. Bottom right: a laptop with OpenSSL 1.1.1 and a server with OpenSSL 1.0.2, joined by a broken arrow labelled mismatch, with the caption works on my machine.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff735e"/><stop offset="1" stop-color="#f4a340"/></linearGradient>
    <filter id="sh" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123c52" flood-opacity=".22"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#5b6b78"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#ff735e"/></marker>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#fff8e9"/>
  <rect x="20" y="20" width="1160" height="660" rx="16" fill="url(#sky)"/>
  <text x="600" y="78" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">Shipping software, and the two things that kept going wrong</text>

  <!-- pipeline card -->
  <g filter="url(#sh)"><rect x="60" y="110" width="1080" height="200" rx="18" fill="#fff"/></g>
  <text x="90" y="145" font-size="16" font-weight="700" fill="#5b6b78">THE FIVE STEPS</text>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1d2b36">
    <!-- 1 development -->
    <rect x="100" y="170" width="150" height="90" rx="12" fill="#fff8e9" stroke="#e5dccb" stroke-width="2"/>
    <text x="175" y="195">1. Development</text>
    <text x="175" y="236" font-size="22" font-weight="400" fill="#126c73" font-family="monospace">{ }</text>
    <!-- 2 testing -->
    <rect x="305" y="170" width="150" height="90" rx="12" fill="#fff8e9" stroke="#e5dccb" stroke-width="2"/>
    <text x="380" y="195">2. Local testing</text>
    <circle cx="380" cy="232" r="14" fill="none" stroke="#126c73" stroke-width="3"/><path d="M373 232l5 5 10-10" fill="none" stroke="#126c73" stroke-width="3" stroke-linecap="round"/>
    <!-- 3 packaging -->
    <rect x="510" y="170" width="150" height="90" rx="12" fill="#fff8e9" stroke="#e5dccb" stroke-width="2"/>
    <text x="585" y="195">3. Packaging</text>
    <rect x="571" y="218" width="28" height="26" rx="3" fill="#ffd166" stroke="#1d2b36" stroke-width="2"/><path d="M571 226h28M585 218v26" stroke="#1d2b36" stroke-width="2"/>
    <!-- 4 deployment -->
    <rect x="715" y="170" width="150" height="90" rx="12" fill="#fff8e9" stroke="#e5dccb" stroke-width="2"/>
    <text x="790" y="195">4. Deployment</text>
    <path d="M790 248V214M778 226l12-12 12 12" fill="none" stroke="#ff735e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 5 production -->
    <rect x="920" y="170" width="150" height="90" rx="12" fill="#fff8e9" stroke="#e5dccb" stroke-width="2"/>
    <text x="995" y="195">5. Production</text>
    <rect x="981" y="212" width="28" height="36" rx="3" fill="#dbe7ee" stroke="#123c52" stroke-width="2"/><rect x="986" y="218" width="18" height="4" fill="#123c52"/><rect x="986" y="226" width="18" height="4" fill="#123c52"/>
    <!-- arrows -->
    <path d="M252 215H300" stroke="#5b6b78" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M457 215H505" stroke="#5b6b78" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M662 215H710" stroke="#5b6b78" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M867 215H915" stroke="#5b6b78" stroke-width="3" marker-end="url(#arr)"/>
  </g>
  <text x="600" y="290" font-size="13" text-anchor="middle" fill="#5b6b78">Write it on your machine. Run it on a different one. That gap is where everything breaks.</text>

  <!-- headache 1 -->
  <g filter="url(#sh)"><rect x="60" y="340" width="525" height="310" rx="18" fill="#fff"/></g>
  <text x="90" y="378" font-size="18" font-weight="700" fill="#ff735e">HEADACHE 1 · Wasted hardware</text>
  <text x="90" y="402" font-size="13" fill="#5b6b78">One app per server, because apps could not safely share.</text>
  <g>
    <!-- three towers, each mostly empty -->
    <rect x="110" y="430" width="120" height="180" rx="8" fill="#dbe7ee" stroke="#123c52" stroke-width="3"/>
    <rect x="122" y="570" width="96" height="28" rx="4" fill="#ffd166" stroke="#1d2b36" stroke-width="2"/>
    <text x="170" y="589" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">app A</text>
    <text x="170" y="500" font-size="12" text-anchor="middle" fill="#5b6b78" font-style="italic">idle</text>

    <rect x="255" y="430" width="120" height="180" rx="8" fill="#dbe7ee" stroke="#123c52" stroke-width="3"/>
    <rect x="267" y="570" width="96" height="28" rx="4" fill="#ffd166" stroke="#1d2b36" stroke-width="2"/>
    <text x="315" y="589" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">app B</text>
    <text x="315" y="500" font-size="12" text-anchor="middle" fill="#5b6b78" font-style="italic">idle</text>

    <rect x="400" y="430" width="120" height="180" rx="8" fill="#dbe7ee" stroke="#123c52" stroke-width="3"/>
    <rect x="412" y="570" width="96" height="28" rx="4" fill="#ffd166" stroke="#1d2b36" stroke-width="2"/>
    <text x="460" y="589" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">app C</text>
    <text x="460" y="500" font-size="12" text-anchor="middle" fill="#5b6b78" font-style="italic">idle</text>
  </g>
  <text x="322" y="636" font-size="13" text-anchor="middle" fill="#1d2b36">Three expensive boxes. Three small programs. Most of each box doing nothing.</text>

  <!-- headache 2 -->
  <g filter="url(#sh)"><rect x="615" y="340" width="525" height="310" rx="18" fill="#fff"/></g>
  <text x="645" y="378" font-size="18" font-weight="700" fill="#ff735e">HEADACHE 2 · "It works on my machine"</text>
  <text x="645" y="402" font-size="13" fill="#5b6b78">The laptop and the server are never quite the same.</text>
  <g>
    <!-- laptop -->
    <rect x="660" y="450" width="150" height="95" rx="8" fill="#dbe7ee" stroke="#123c52" stroke-width="3"/>
    <rect x="645" y="545" width="180" height="12" rx="4" fill="#123c52"/>
    <text x="735" y="480" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">your laptop</text>
    <rect x="675" y="495" width="120" height="30" rx="6" fill="#7edbd0"/>
    <text x="735" y="515" font-size="12" font-weight="700" text-anchor="middle" fill="#123c52">OpenSSL 1.1.1</text>
    <text x="735" y="585" font-size="12" text-anchor="middle" fill="#126c73" font-weight="700">works</text>

    <!-- broken arrow -->
    <path d="M835 500H880" stroke="#ff735e" stroke-width="4" stroke-linecap="round"/>
    <path d="M895 490l10 20M905 490l10 20" stroke="#ff735e" stroke-width="4" stroke-linecap="round"/>
    <path d="M925 500H965" stroke="#ff735e" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="900" y="535" font-size="12" font-weight="700" text-anchor="middle" fill="#ff735e">mismatch</text>

    <!-- server -->
    <rect x="985" y="440" width="110" height="130" rx="8" fill="#dbe7ee" stroke="#123c52" stroke-width="3"/>
    <text x="1040" y="468" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">the server</text>
    <rect x="995" y="483" width="90" height="30" rx="6" fill="#ffd166"/>
    <text x="1040" y="503" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2b36">OpenSSL 1.0.2</text>
    <rect x="1000" y="530" width="80" height="6" rx="2" fill="#123c52"/><rect x="1000" y="544" width="80" height="6" rx="2" fill="#123c52"/>
    <text x="1040" y="596" font-size="12" text-anchor="middle" fill="#ff735e" font-weight="700">breaks</text>
  </g>
  <text x="877" y="636" font-size="13" text-anchor="middle" fill="#1d2b36">Different library, OS, or settings, and the same code behaves differently.</text>
</svg>
