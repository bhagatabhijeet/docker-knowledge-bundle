<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">How containers evolved, 1979 to today</title>
  <desc id="d">Timeline from chroot in 1979 through FreeBSD jails, Solaris Zones, Linux namespaces and cgroups, LXC, Docker in 2013, the Open Container Initiative in 2015, and Kubernetes becoming the standard way to run containers at scale.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff735e"/><stop offset="1" stop-color="#f4a340"/></linearGradient>
    <filter id="sh" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123c52" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fff8e9"/>
  <rect x="20" y="20" width="1160" height="720" rx="16" fill="url(#sky)"/>
<text x="600" y="88" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Forty-some years of putting programs in boxes</text>
<g filter="url(#sh)"><rect x="60" y="120" width="1080" height="560" rx="18" fill="#fff"/></g><path d="M120 400H1080" stroke="#e5dccb" stroke-width="8" stroke-linecap="round"/><circle cx="150.0" cy="400" r="14" fill="#ff735e" stroke="#fff" stroke-width="4"/><path d="M150.0 386V330" stroke="#ff735e" stroke-width="3"/><text x="150.0" y="205" font-size="15" font-weight="700" text-anchor="middle" fill="#ff735e" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>1979</text>
<text x="150.0" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>chroot</text>
<text x="150.0" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Unix gets a way to lock a program</text>
<text x="150.0" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>into one folder.</text>
<circle cx="278.57142857142856" cy="400" r="14" fill="#f4a340" stroke="#fff" stroke-width="4"/><path d="M278.57142857142856 414V460" stroke="#f4a340" stroke-width="3"/><text x="278.57142857142856" y="490" font-size="15" font-weight="700" text-anchor="middle" fill="#f4a340" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2000</text>
<text x="278.57142857142856" y="515" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>FreeBSD jails</text>
<text x="278.57142857142856" y="542" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Folders plus network and users.</text>
<text x="278.57142857142856" y="560" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>A real walled garden.</text>
<circle cx="407.14285714285717" cy="400" r="14" fill="#126c73" stroke="#fff" stroke-width="4"/><path d="M407.14285714285717 386V330" stroke="#126c73" stroke-width="3"/><text x="407.14285714285717" y="205" font-size="15" font-weight="700" text-anchor="middle" fill="#126c73" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2002</text>
<text x="407.14285714285717" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Linux namespaces</text>
<text x="407.14285714285717" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Linux starts letting each process</text>
<text x="407.14285714285717" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>see its own private world.</text>
<circle cx="535.7142857142858" cy="400" r="14" fill="#123c52" stroke="#fff" stroke-width="4"/><path d="M535.7142857142858 414V460" stroke="#123c52" stroke-width="3"/><text x="535.7142857142858" y="490" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2006</text>
<text x="535.7142857142858" y="515" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>cgroups</text>
<text x="535.7142857142858" y="542" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Google teaches Linux to ration</text>
<text x="535.7142857142858" y="560" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>CPU and memory per group.</text>
<circle cx="664.2857142857143" cy="400" r="14" fill="#ff735e" stroke="#fff" stroke-width="4"/><path d="M664.2857142857143 386V330" stroke="#ff735e" stroke-width="3"/><text x="664.2857142857143" y="205" font-size="15" font-weight="700" text-anchor="middle" fill="#ff735e" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2008</text>
<text x="664.2857142857143" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>LXC</text>
<text x="664.2857142857143" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Namespaces and cgroups glued</text>
<text x="664.2857142857143" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>into usable Linux containers.</text>
<circle cx="792.8571428571429" cy="400" r="14" fill="#f4a340" stroke="#fff" stroke-width="4"/><path d="M792.8571428571429 414V460" stroke="#f4a340" stroke-width="3"/><text x="792.8571428571429" y="490" font-size="15" font-weight="700" text-anchor="middle" fill="#f4a340" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2013</text>
<text x="792.8571428571429" y="515" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker</text>
<text x="792.8571428571429" y="542" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Images, a registry, one command.</text>
<text x="792.8571428571429" y="560" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Containers go mainstream.</text>
<circle cx="921.4285714285716" cy="400" r="14" fill="#126c73" stroke="#fff" stroke-width="4"/><path d="M921.4285714285716 386V330" stroke="#126c73" stroke-width="3"/><text x="921.4285714285716" y="205" font-size="15" font-weight="700" text-anchor="middle" fill="#126c73" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>2015</text>
<text x="921.4285714285716" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>OCI + containerd</text>
<text x="921.4285714285716" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Open standards so any tool can</text>
<text x="921.4285714285716" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>build and run any container.</text>
<circle cx="1050.0" cy="400" r="14" fill="#123c52" stroke="#fff" stroke-width="4"/><path d="M1050.0 414V460" stroke="#123c52" stroke-width="3"/><text x="1050.0" y="490" font-size="15" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Today</text>
<text x="1050.0" y="515" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Kubernetes era</text>
<text x="1050.0" y="542" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Fleets of containers scheduled</text>
<text x="1050.0" y="560" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>across whole data centers.</text>
<rect x="20" y="698" width="1160" height="42" fill="#123c52" fill-opacity=".9"/><path d="M20 740a16 16 0 0 0 16 16h1128a16 16 0 0 0 16-16z" fill="#123c52" fill-opacity=".9"/><text x="600.0" y="725" font-size="15" font-weight="600" text-anchor="middle" fill="#7edbd0" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker did not invent containers. It made them easy enough that everyone finally used them.</text>
</svg>
