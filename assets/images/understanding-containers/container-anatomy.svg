<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">What a container really is</title>
  <desc id="d">Diagram: a Linux machine with one kernel. Three containers sit on it; each is just a normal process wrapped in namespaces (its own view of files, network, process list) and cgroups (limits on CPU and memory).</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff735e"/><stop offset="1" stop-color="#f4a340"/></linearGradient>
    <filter id="sh" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123c52" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fff8e9"/>
  <rect x="20" y="20" width="1160" height="720" rx="16" fill="url(#sky)"/>
<text x="600" y="88" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>A container is a process wearing blinders and a seatbelt</text>
<g filter="url(#sh)"><rect x="80" y="560" width="1040" height="80" rx="14" fill="#123c52"/></g><text x="600" y="595" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Your computer: CPU, memory, disk</text>
<text x="600" y="622" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>the hardware</text>
<rect x="80" y="470" width="1040" height="80" rx="14" fill="#126c73"/><text x="600" y="505" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>One Linux kernel</text>
<text x="600" y="532" font-size="13" font-weight="400" text-anchor="middle" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>the traffic cop that every program must ask for memory, files, and network</text>
<g filter="url(#sh)"><rect x="100" y="140" width="300" height="310" rx="16" fill="#fff"/></g><text x="250" y="180" font-size="20" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Container A</text>
<rect x="130" y="200" width="240" height="70" rx="10" fill="#ffd166"/><text x="250" y="232" font-size="17" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>a normal process</text>
<text x="250" y="255" font-size="13" font-weight="400" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>a web server</text>
<rect x="130" y="285" width="240" height="64" rx="10" fill="#ff735e" fill-opacity=".18" stroke="#ff735e" stroke-width="2"/><text x="250" y="312" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>namespaces = blinders</text>
<text x="250" y="334" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own files, network, process list</text>
<rect x="130" y="362" width="240" height="64" rx="10" fill="#126c73" fill-opacity=".16" stroke="#126c73" stroke-width="2"/><text x="250" y="389" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>cgroups = seatbelt</text>
<text x="250" y="411" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>limits on CPU and memory</text>
<path d="M250 450v20" stroke="#fff8e9" stroke-width="4" stroke-dasharray="6 6"/><g filter="url(#sh)"><rect x="450" y="140" width="300" height="310" rx="16" fill="#fff"/></g><text x="600" y="180" font-size="20" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Container B</text>
<rect x="480" y="200" width="240" height="70" rx="10" fill="#ffd166"/><text x="600" y="232" font-size="17" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>a normal process</text>
<text x="600" y="255" font-size="13" font-weight="400" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>a database</text>
<rect x="480" y="285" width="240" height="64" rx="10" fill="#ff735e" fill-opacity=".18" stroke="#ff735e" stroke-width="2"/><text x="600" y="312" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>namespaces = blinders</text>
<text x="600" y="334" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own files, network, process list</text>
<rect x="480" y="362" width="240" height="64" rx="10" fill="#126c73" fill-opacity=".16" stroke="#126c73" stroke-width="2"/><text x="600" y="389" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>cgroups = seatbelt</text>
<text x="600" y="411" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>limits on CPU and memory</text>
<path d="M600 450v20" stroke="#fff8e9" stroke-width="4" stroke-dasharray="6 6"/><g filter="url(#sh)"><rect x="800" y="140" width="300" height="310" rx="16" fill="#fff"/></g><text x="950" y="180" font-size="20" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Container C</text>
<rect x="830" y="200" width="240" height="70" rx="10" fill="#ffd166"/><text x="950" y="232" font-size="17" font-weight="700" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>a normal process</text>
<text x="950" y="255" font-size="13" font-weight="400" text-anchor="middle" fill="#123c52" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>your Python script</text>
<rect x="830" y="285" width="240" height="64" rx="10" fill="#ff735e" fill-opacity=".18" stroke="#ff735e" stroke-width="2"/><text x="950" y="312" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>namespaces = blinders</text>
<text x="950" y="334" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>its own files, network, process list</text>
<rect x="830" y="362" width="240" height="64" rx="10" fill="#126c73" fill-opacity=".16" stroke="#126c73" stroke-width="2"/><text x="950" y="389" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>cgroups = seatbelt</text>
<text x="950" y="411" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>limits on CPU and memory</text>
<path d="M950 450v20" stroke="#fff8e9" stroke-width="4" stroke-dasharray="6 6"/><rect x="20" y="698" width="1160" height="42" fill="#123c52" fill-opacity=".9"/><path d="M20 740a16 16 0 0 0 16 16h1128a16 16 0 0 0 16-16z" fill="#123c52" fill-opacity=".9"/><text x="600.0" y="725" font-size="15" font-weight="600" text-anchor="middle" fill="#7edbd0" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>All three containers share the same kernel. None of them can tell the others exist.</text>
</svg>
