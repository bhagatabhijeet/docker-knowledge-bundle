<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Docker Desktop versus Docker Engine</title>
  <desc id="d">Diagram comparing Docker Desktop, an application that bundles a GUI, a Linux virtual machine and Docker Engine, with Docker Engine, the daemon and CLI installed directly on Linux.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff735e"/><stop offset="1" stop-color="#f4a340"/></linearGradient>
    <filter id="sh" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#123c52" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fff8e9"/>
  <rect x="20" y="20" width="1160" height="720" rx="16" fill="url(#sky)"/>
<text x="600" y="90" font-size="32" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker Desktop vs Docker Engine</text>
<g filter="url(#sh)"><rect x="80" y="130" width="520" height="520" rx="18" fill="#fff"/></g><text x="340" y="180" font-size="26" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker Desktop</text>
<text x="340" y="208" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Windows · macOS · Linux desktops</text>
<rect x="110" y="240" width="460" height="98" rx="12" fill="#f4a340" fill-opacity="0.16" stroke="#f4a340" stroke-width="2"/><text x="130" y="280" font-size="20" font-weight="700" text-anchor="start" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Dashboard app and settings</text>
<text x="130" y="310" font-size="14" font-weight="400" text-anchor="start" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>GUI, extensions, updates</text>
<rect x="110" y="360" width="460" height="98" rx="12" fill="#126c73" fill-opacity="0.16" stroke="#126c73" stroke-width="2"/><text x="130" y="400" font-size="20" font-weight="700" text-anchor="start" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Lightweight Linux VM</text>
<text x="130" y="430" font-size="14" font-weight="400" text-anchor="start" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>WSL 2 on Windows, Apple Virtualization on Mac</text>
<rect x="110" y="480" width="460" height="98" rx="12" fill="#123c52" fill-opacity="1" stroke="#123c52" stroke-width="2"/><text x="130" y="520" font-size="20" font-weight="700" text-anchor="start" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker Engine</text>
<text x="130" y="550" font-size="14" font-weight="400" text-anchor="start" fill="#dbe7ee" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>dockerd daemon + docker CLI + containerd</text>
<text x="340" y="625" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>One download, one license agreement, one place to click.</text>
<g filter="url(#sh)"><rect x="640" y="130" width="480" height="520" rx="18" fill="#fff"/></g><text x="880" y="180" font-size="26" font-weight="700" text-anchor="middle" fill="#1d2b36" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Docker Engine</text>
<text x="880" y="208" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Linux servers, Ubuntu, WSL distros, Raspberry Pi</text>
<rect x="670" y="240" width="420" height="338" rx="12" fill="#123c52"/><text x="880" y="290" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>dockerd daemon</text>
<text x="880" y="330" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>docker CLI</text>
<text x="880" y="370" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>containerd + runc</text>
<text x="880" y="410" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>buildx + compose plugins</text>
<g transform="translate(835,450) scale(1.0)"><path d="M0 36c0 16 14 28 36 28h22c26 0 44-14 50-34 8 0 14-3 18-8-4-3-10-4-16-2-3-8-8-12-14-14 0 6-2 10-6 12H0z" fill="#7edbd0"/><rect x="10" y="16" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><rect x="26" y="16" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><rect x="42" y="16" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><rect x="26" y="2" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><rect x="42" y="2" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><rect x="58" y="16" width="13" height="12" fill="#fff" stroke="#7edbd0" stroke-width="2"/><circle cx="24" cy="46" r="2.5" fill="#fff"/></g><text x="880" y="625" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b78" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>No VM, no GUI, Apache 2.0 licensed, runs on the host kernel.</text>
<path d="M600 390h40" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/><text x="620" y="372" text-anchor="middle" font-size="13" fill="#fff8e9" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>contains</text><rect x="20" y="698" width="1160" height="42" fill="#123c52" fill-opacity=".9"/><path d="M20 740a16 16 0 0 0 16 16h1128a16 16 0 0 0 16-16z" fill="#123c52" fill-opacity=".9"/><text x="600.0" y="725" font-size="15" font-weight="600" text-anchor="middle" fill="#7edbd0" font-family='Ubuntu, Segoe UI, Helvetica, Arial, sans-serif'>Desktop is the whole kitchen. Engine is the stove.</text>
</svg>
